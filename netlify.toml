# netlify.toml - Netlify configuration file for LabLens PWA deployment

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; img-src 'self' data: blob: https:; worker-src 'self' blob:; connect-src 'self' https:;"

# Retired snapshots contain old runtime dependency paths. Keep them inaccessible
# on the production origin so they cannot execute beside current local health data.
[[redirects]]
  from = "/LabLens_multimodal.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/lablens-netlify-deploy/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/lablens-netlify-deploy.zip"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/test-fixtures/*"
  to = "/"
  status = 404
  force = true

# Ensure the service worker is never cached so updates propagate instantly
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Ensure the manifest is always fresh
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
